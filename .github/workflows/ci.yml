name: ci

on:
  push:
    # Pin action versions: tags are mutable, SHAs are not. Each `uses` line pins
    # the commit SHA with the human tag kept as an inline comment for review.
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# One run per ref; newer pushes cancel in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  secrets:
    name: secrets (tracked-file scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-secrets.mjs

  secrets-history:
    name: secrets (full git history scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2 — full depth so every commit is scannable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      # A credential committed at any point stays in history; the manual
      # `check-secrets:history` step is now enforced here. (Deliberately no
      # gitleaks invocation: there is no `gitleaks` npm executable, so an
      # `npx gitleaks` step cannot resolve — and the GitHub Action variant
      # requires a license key for org CI. The dependency-free scanner below
      # already covers the full commit DAG.)
      - run: node scripts/check-secrets.mjs --history

  shared:
    name: shared (build + contract tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/shared
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/shared/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  web:
    name: web (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Fail on critical advisories; high/moderate stay visible in the log.
      - run: npm audit --omit=dev --audit-level=high

  api:
    name: api (lint + build + unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/aiacademy-test
          REDIS_URL: redis://localhost:6379
      - run: npm run test:e2e
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/aiacademy-test
          REDIS_URL: redis://localhost:6379
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test -- --run --coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/aiacademy-test
          REDIS_URL: redis://localhost:6379

  mobile:
    name: mobile (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # High (not critical): residual `image-size` chain via metro has no
      # patched release — the DB's only fix is react-native@0.87 (breaking,
      # needs a full Expo SDK upgrade). Exposure is dev-time only (metro
      # parses repo-controlled image assets at bundle time; nothing ships to
      # devices/servers). Pinned maximal overrides in package.json instead.
      # Revisit on a fixed image-size release or Expo SDK upgrade.
      - run: npm audit --omit=dev --audit-level=critical
