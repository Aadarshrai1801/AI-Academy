# Container + supply-chain scanning for the deployable API image.
# - Trivy scans the built image for OS + library CVEs (fails only on
#   CRITICAL/HIGH unfixed issues so routine runs stay green).
# - `npm sbom` (npm ≥ 10) emits a CycloneDX SBOM per workspace; the bundle is
#   uploaded as an artifact so audits and license reviews can inspect it.
# - Does NOT block merges on advisory-only findings; CodeQL + npm audit in
#   `ci.yml` remain the gates. Weekly schedule catches newly published CVEs.
name: trivy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

# Least privilege: read the repo; nothing is published.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  image:
    name: trivy (api image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build API image
        run: docker build -t ai-academy-api:ci ./apps/api
      # aquasecurity/trivy-action v0.36.0
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ai-academy-api:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # Upload SARIF to the Security tab (needs the same permission as CodeQL).
      # aquasecurity/trivy-action v0.36.0
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        if: always()
        with:
          sarif_file: trivy-image.sarif

  sbom:
    name: sbom (cyclonedx per workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      # `--package-lock-only` resolves the dependency graph straight from each
      # lockfile, so this job needs NO install and therefore makes no network
      # requests at all.
      #
      # It previously ran `npm ci` across all four workspaces (~1000 packages,
      # uncached, the only job in the repo without `cache: npm`) and that cold
      # download is what died with ECONNRESET. The install looked necessary
      # because plain `npm sbom` walks the installed tree; the flag removes that
      # requirement. Verified per workspace: shared 0, api 129, web 256,
      # mobile 774 prod components, all resolved with node_modules absent.
      - name: Emit CycloneDX SBOMs (npm sbom, no install required)
        run: |
          mkdir -p sbom
          for pkg in packages/shared apps/api apps/web apps/mobile; do
            name=$(echo "$pkg" | tr '/' '-')
            npm sbom --prefix "$pkg" --sbom-format cyclonedx --omit dev --package-lock-only > "sbom/$name.cyclonedx.json"
          done
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-cyclonedx
          path: sbom/
          retention-days: 90