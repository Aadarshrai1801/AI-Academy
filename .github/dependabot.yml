version: 2
updates:
  # Keep the four npm projects patched (security + routine updates).
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ["@nestjs/*"]
      aws-sdk:
        patterns: ["@aws-sdk/*"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /packages/shared
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # GitHub Actions used by the workflows (SHA pinning handled at review time).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
